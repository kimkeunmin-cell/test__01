<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Snake Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      padding-top: 30px;
    }
    h1 {
      margin-bottom: 10px;
    }
    #info {
      margin-bottom: 15px;
      font-size: 14px;
      color: #aaa;
    }
    #score {
      margin-bottom: 10px;
      font-size: 16px;
    }
    canvas {
      background: #222;
      border: 2px solid #555;
    }
  </style>
</head>
<body>
  <h1>Snake Game</h1>
  <div id="info">방향키(↑ ↓ ← →)로 조작하세요</div>
  <div id="score">Score: <span id="scoreValue">0</span></div>
  <canvas id="game" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("scoreValue");

    const tileCount = 20;          // 20x20 격자
    const tileSize = canvas.width / tileCount;

    let snake = [{ x: 10, y: 10 }]; // 시작 위치
    let vx = 1;                     // x 방향 속도 (1칸씩)
    let vy = 0;                     // y 방향 속도
    let food = randomFood();
    let score = 0;
    let gameOver = false;

    function randomFood() {
      return {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
    }

    function draw() {
      if (gameOver) return;

      // 배경
      ctx.fillStyle = "#222";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 음식
      ctx.fillStyle = "#e74c3c";
      ctx.fillRect(food.x * tileSize, food.y * tileSize, tileSize, tileSize);

      // 뱀 이동
      const head = { x: snake[0].x + vx, y: snake[0].y + vy };

      // 벽 충돌 체크
      if (
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount
      ) {
        endGame();
        return;
      }

      // 몸통 충돌 체크
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          endGame();
          return;
        }
      }

      snake.unshift(head); // 새 머리 추가

      // 음식 먹었는지 체크
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        food = randomFood();
      } else {
        snake.pop(); // 꼬리 제거
      }

      // 뱀 그리기
      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? "#2ecc71" : "#27ae60";
        ctx.fillRect(
          snake[i].x * tileSize,
          snake[i].y * tileSize,
          tileSize - 1,
          tileSize - 1
        );
      }
    }

    function endGame() {
      gameOver = true;
      ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff";
      ctx.font = "28px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = "18px Arial";
      ctx.fillText(
        "새로고침(F5)으로 다시 시작",
        canvas.width / 2,
        canvas.height / 2 + 20
      );
    }

    // 방향키 입력
    document.addEventListener("keydown", (e) => {
      switch (e.key) {
        case "ArrowUp":
          if (vy === 1) break; // 바로 반대 방향 금지
          vx = 0;
          vy = -1;
          break;
        case "ArrowDown":
          if (vy === -1) break;
          vx = 0;
          vy = 1;
          break;
        case "ArrowLeft":
          if (vx === 1) break;
          vx = -1;
          vy = 0;
          break;
        case "ArrowRight":
          if (vx === -1) break;
          vx = 1;
          vy = 0;
          break;
      }
    });

    // 게임 루프 (속도 조절: 100ms)
    setInterval(draw, 100);
  </script>
</body>
</html>
